services:
  - type: web
    name: abc-university-management
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python backend/init_db.py
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
